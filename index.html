<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="中国铁路网络总览 — 高铁与普速铁路" />
    <title>中国铁路</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48'%3E🚄%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="brand">
          <span class="brand-icon" aria-hidden="true">🚄</span>
          <div>
            <h1>中国铁路</h1>
            <p id="meta" class="meta">加载中…</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="btn-search" type="button" class="btn" aria-label="搜索">搜索</button>
          <button id="btn-fit" type="button" class="btn">全国</button>
        </div>
      </header>

      <div id="toggles" class="toggles" role="group" aria-label="线路开关">
        <label class="toggle">
          <input type="checkbox" id="tog-hsr" checked />
          <span class="sw hsr"></span>
          <span>高铁</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="tog-conv" checked />
          <span class="sw conv"></span>
          <span>普铁</span>
        </label>
        <label class="toggle">
          <input type="checkbox" id="tog-sta" checked />
          <span class="sw sta"></span>
          <span>站点</span>
        </label>
      </div>

      <div id="map" aria-label="中国铁路地图"></div>

      <div id="legend" class="legend" aria-label="图例">
        <span><i class="line hsr"></i>高铁</span>
        <span><i class="line conv"></i>普速</span>
        <span><i class="dot sta"></i>主要站</span>
      </div>

      <div id="status" class="status" hidden></div>

      <div id="search-panel" class="search-panel" hidden>
        <div class="search-head">
          <input id="search-input" type="search" placeholder="搜索线路 / 车站…" autocomplete="off" />
          <button id="btn-search-close" type="button" class="btn">关闭</button>
        </div>
        <ul id="search-results" class="search-results"></ul>
      </div>

      <aside id="sheet" class="sheet" hidden>
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-body">
          <div class="sheet-head">
            <span id="sheet-kind" class="badge"></span>
            <h2 id="sheet-title"></h2>
          </div>
          <p id="sheet-meta" class="sheet-meta"></p>
          <div class="sheet-actions">
            <button id="btn-close" type="button" class="btn">关闭</button>
          </div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
